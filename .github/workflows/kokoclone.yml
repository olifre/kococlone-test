name: Run KokoClone TTS

on:
  workflow_dispatch:
    inputs:
      text_to_speak:
        description: 'Text für die Sprachausgabe'
        required: true
        default: 'This run is powered by uv and is blisteringly fast.'
        type: string

jobs:
  generate-speech:
    runs-on: ubuntu-latest

    steps:
      # Nur noch dein eigenes Repo auschecken!
      - name: Dein Repo auschecken
        uses: actions/checkout@v4

      # 1. Setup uv (ABER wir deaktivieren den unvollständigen automatischen Cache!)
      - name: Setup uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: false

      # 2. DER TRICK: Wir cachen die echten, internen uv-Verzeichnisse manuell
      - name: Cache uv Verzeichnis (Inklusive Git-Repos und PyTorch-CPU)
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/uv
            .venv
          key: ${{ runner.os }}-uv-full-cache-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-uv-full-cache-

      - name: Cache Hugging Face Models
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: ${{ runner.os }}-hf-kokoclone-v1

      - name: System-Abhängigkeiten installieren
        run: |
          sudo apt-get update
          sudo apt-get install -y espeak-ng ffmpeg

      # uv installiert die richtige Python-Version und lädt die Git-Repos direkt aus der Datei
      - name: Abhängigkeiten mit uv installieren
        run: |
          uv venv --python 3.12
          uv pip install -r requirements.txt

      - name: Sprachausgabe generieren
        env:
          INPUT_TEXT: ${{ inputs.text_to_speak }}
        run: |
          # Skript innerhalb der uv-Umgebung ausführen
          uv run python run_clone.py

      - name: Audio-Ergebnis hochladen
        uses: actions/upload-artifact@v4
        with:
          name: cloned-speech-output-uv
          path: output.wav
