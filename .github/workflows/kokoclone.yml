name: Run KokoClone TTS

on:
  workflow_dispatch:
    inputs:
      text_to_speak:
        description: 'Text für die Sprachausgabe'
        required: true
        default: 'This run is powered by uv and is blisteringly fast.'
        type: string

jobs:
  generate-speech:
    runs-on: ubuntu-latest

    steps:
      # Nur noch dein eigenes Repo auschecken!
      - name: Dein Repo auschecken
        uses: actions/checkout@v7

      # 1. Setup uv (ABER wir deaktivieren den unvollständigen automatischen Cache!)
      - name: Setup uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: false

      # JETZT MIT TORCH-HUB UND HUGGINGFACE-CACHE!
      - name: All-in-One Cache (Packages + AI Models)
        uses: actions/cache@v6
        with:
          path: |
            ~/.cache/uv
            ~/.cache/torch
            ~/.cache/huggingface
            model
            voice
            .venv
          key: ${{ runner.os }}-kokoclone-v1-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-kokoclone-v1-

      - name: System-Abhängigkeiten installieren
        run: |
          sudo apt-get update
          sudo apt-get install -y espeak-ng ffmpeg

      # uv installiert die richtige Python-Version und lädt die Git-Repos direkt aus der Datei
      - name: Abhängigkeiten mit uv installieren
        run: |
          if [ ! -d ".venv" ]; then
            uv venv --python 3.12
          fi
          uv pip install -r requirements.txt

      - name: Ordnerstrukturen vorbereiten
        run: |
          mkdir -p model
          mkdir -p voice

      - name: Sprachausgabe generieren
        env:
          INPUT_TEXT: ${{ inputs.text_to_speak }}
        run: |
          # Skript innerhalb der uv-Umgebung ausführen
          uv run python run_clone.py

      - name: Audio-Ergebnis hochladen
        uses: actions/upload-artifact@v7
        with:
          name: cloned-speech-output-uv
          path: output.wav

  clear-old-caches:
    runs-on: ubuntu-latest
    needs: generate-speech
    permissions:
      actions: write
      contents: read

    steps:
      - name: Purge old caches
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          CUTOFF_DATE=$(date -d "7 days ago" -u +"%Y-%m-%dT%H:%M:%SZ")
          CURR_CACHES=$(gh cache list --limit 100 --json id,lastAccessedAt)
          CACHE_IDS=$(echo "${CURR_CACHES}" | jq -r ".[] | select(.lastAccessedAt < \"${CUTOFF_DATE}\") | .id")
          echo "Current caches:"
          echo "${CURR_CACHES}" | jq
          if [ -z "${CACHE_IDS}" ]; then
            echo "No old unaccessed caches found."
          else
            for id in $CACHE_IDS; do
              gh cache delete "$id"
            done
          fi
